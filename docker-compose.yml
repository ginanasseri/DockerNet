services:
  router:
    build:
      context: .
      dockerfile: Dockerfile-router
    container_name: router
    hostname: router
    command: /bin/bash -c "/home/dockerNet/setup-router.sh && tail -f /dev/null"
    networks:
      r-h1-net:
        ipv4_address: 192.168.1.2
      r-h2-net:
        ipv4_address: 10.10.1.2
      r-nat-net:
        ipv4_address: 172.16.1.2
    volumes:
      - /Users/ginanasseri/dockerNet:/home/dockerNet # Update to your path 
    cap_add:
      - NET_ADMIN
    restart: always

  gateway:
    build:
      context: .
      dockerfile: Dockerfile-gateway
    container_name: gateway
    hostname: gateway
    command: /bin/bash -c "/home/dockerNet/setup-gateway.sh && tail -f /dev/null"
    networks:
      r-nat-net:
        ipv4_address: 172.16.1.3
      nat-net:
        ipv4_address: 172.20.1.2  
    volumes:
      - /Users/ginanasseri/dockerNet:/home/dockerNet # Update to your path 
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    restart: always

  host1:
    build:
      context: .
      dockerfile: Dockerfile-hosts
    container_name: host1
    hostname: host1
    command: /bin/bash -c "tail -f /dev/null"
    networks:
      r-h1-net:
        ipv4_address: 192.168.1.100
    volumes:
      - /Users/ginanasseri/dockerNet:/home/dockerNet # Update to your path
    cap_add:
      - NET_ADMIN
    restart: always

  host2:
    build:
      context: .
      dockerfile: Dockerfile-hosts
    container_name: host2
    hostname: host2
    command: /bin/bash -c "tail -f /dev/null"
    networks:
      r-h2-net:
        ipv4_address: 10.10.1.200
    volumes:
      - /Users/ginanasseri/dockerNet:/home/dockerNet # Update to your path
    cap_add:
      - NET_ADMIN
    restart: always

networks:
  r-h1-net:
    name: router-host1
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/24

  r-h2-net:
    name: router-host2
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.1.0/24

  r-nat-net:
    name: router-gateway
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.1.0/24

  nat-net:       # external network for NAT
    name: gateway-nat
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.1.0/24  
